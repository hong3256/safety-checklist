<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f4e79">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="안전보건 점검">
<title>만천초등학교 안전보건 자체점검표</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon.ico" sizes="any">
<style>
:root{
  --navy:#1f4e79; --navy2:#2e6ba8; --ink:#12253a; --muted:#5b6b7c;
  --line:#c8d3e0; --line2:#e2e8f0; --bg:#eef2f7;
  --yes-bg:#e2f4e2; --yes-line:#8ccf8f; --yes-ink:#1b5e20;
  --no-bg:#fdeaea; --no-line:#f0a8a8; --no-ink:#b71c1c;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","맑은 고딕",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.45;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit}
/* ---------- 상단 바 ---------- */
.stick{position:sticky; top:0; z-index:30; background:#fff; border-bottom:1px solid var(--line); box-shadow:0 1px 6px rgba(18,37,58,.06)}
.topbar{max-width:1180px; margin:0 auto; display:flex; align-items:center; gap:8px; padding:7px 10px; flex-wrap:nowrap}
.brand{display:flex; align-items:center; gap:8px; min-width:0}
.logo{font-size:20px; line-height:1}
.bwrap{display:flex; flex-direction:column; min-width:0}
.bt{font-weight:800; font-size:15px; color:var(--navy); letter-spacing:-.3px; white-space:nowrap}
.bsub{font-size:11px; color:var(--muted); white-space:nowrap}
.ym{display:inline-flex; align-items:center; gap:3px; margin-top:2px}
.ym select{
  font:inherit; font-size:12px; font-weight:800; color:var(--navy);
  background:#eaf1f9; border:1px solid #d3e1f1; border-radius:7px;
  padding:2px 2px; min-height:26px; cursor:pointer;
}
.ym select:focus{outline:2px solid #8fb8e8; outline-offset:0}
.tools{margin-left:auto; display:flex; align-items:center; gap:6px}
.badge{
  display:inline-flex; align-items:center; gap:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:48vw; font-size:12px; font-weight:700; color:#8a6d00; background:#fff8e1;
  border:1px solid #ffe082; border-radius:999px; padding:5px 10px; cursor:pointer;
}
.badge.ok{color:#1b5e20; background:#e8f5e9; border-color:#a5d6a7}
.ibtn{
  border:1px solid var(--line); background:#f7f9fc; border-radius:10px; padding:6px 8px;
  font-size:15px; line-height:1; cursor:pointer; min-width:36px; min-height:34px;
}
.ibtn:active{background:#e9eff7}
.ibtn[disabled]{opacity:.45}
.tabs{max-width:1180px; margin:0 auto; display:flex; gap:6px; overflow-x:auto; padding:6px 10px 8px; scrollbar-width:thin}
.tabs::-webkit-scrollbar{height:4px}
.tabs::-webkit-scrollbar-thumb{background:#c8d3e0; border-radius:4px}
.tab{
  flex:0 0 auto; white-space:nowrap; border:1px solid #d5dee8; background:#f6f9fc; color:#33475b;
  border-radius:999px; padding:7px 13px; font-size:13px; font-weight:700; cursor:pointer;
}
.tab.active{background:var(--navy); border-color:var(--navy); color:#fff}
/* ---------- 본문 ---------- */
.wrap{max-width:1180px; margin:0 auto; padding:12px 10px 40px}
.panel{display:none; background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden;
  box-shadow:0 2px 10px rgba(18,37,58,.05)}
.panel.active{display:block}
.ph{padding:14px 14px 10px; background:linear-gradient(180deg,#f7fafe,#fff); text-align:center}
.pt{font-size:16.5px; font-weight:800; color:var(--navy); text-align:center; letter-spacing:-.3px; line-height:1.35}
.ps{font-size:14px; font-weight:700; color:#33475b; text-align:center; margin-top:3px}
.pd{font-size:12px; color:var(--muted); margin-top:7px; line-height:1.5; text-align:center}
.period{display:inline-block; font-size:12px; font-weight:700; color:var(--navy); background:#eaf1f9; border:1px solid #d3e1f1;
  border-radius:999px; padding:3px 10px; margin-bottom:6px}
.meta-row{display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; padding:10px 14px; background:#f8fafc; border-top:1px solid var(--line2); border-bottom:1px solid var(--line2)}
.allnote{padding:7px 14px; font-size:12px; color:#1f4e79; background:#eef5fc; border-bottom:1px solid var(--line2); line-height:1.5}
.mf{display:flex; align-items:center; gap:7px}
.mf label{font-weight:800; font-size:13px; color:#33475b; white-space:nowrap}
.mf input{font:inherit; font-size:13px; padding:6px 9px; border:1px solid #c9d6e4; border-radius:8px; background:#fffde9; color:var(--ink); min-height:34px}
.mf input.inp-date{width:150px}
.mf input.inp-name{width:130px}
.mf input:focus{outline:2px solid #8fb8e8; outline-offset:0; border-color:#8fb8e8}
.prog{margin-left:auto; display:flex; align-items:center; gap:8px; font-size:12px; font-weight:800; color:var(--navy); white-space:nowrap}
.bar{width:110px; height:8px; background:#e2e8f0; border-radius:999px; overflow:hidden}
.bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,#43a047,#66bb6a); transition:width .2s}
.table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{width:100%; border-collapse:collapse; background:#fff; min-width:660px}
th,td{border:1px solid #cdd7e3; padding:5px 6px; vertical-align:middle}
thead th{background:var(--navy); color:#fff; font-size:12px; font-weight:800; text-align:center; padding:8px 4px; border-color:#4a7aa8; white-space:nowrap}
.col-g{width:74px} .col-num{width:54px} .col-item{width:auto} .col-y{width:54px} .col-n{width:62px} .col-note{width:168px}
td.col-g{background:#f2f5f9; font-size:11.5px; font-weight:800; color:#1f3864; text-align:center; line-height:1.3; padding:4px; vertical-align:top}
td.col-g[rowspan]{padding-top:10px}
td.col-num{text-align:center; font-weight:800; color:#404040; font-size:13px}
td.col-item{font-size:13px; line-height:1.5; white-space:pre-line; word-break:keep-all; overflow-wrap:anywhere}
td.col-y,td.col-n{padding:3px; text-align:center}
.mark{
  display:flex; align-items:center; justify-content:center;
  width:100%; min-height:36px; border:1px dashed #cfd8e3; border-radius:8px; background:#fff;
  color:transparent; font-size:20px; font-weight:900; line-height:1; cursor:pointer; padding:0 0 2px;
  transition:background .12s,border-color .12s;
}
.mark:active{transform:scale(.97)}
td.col-y.on{background:var(--yes-bg)}
td.col-n.on{background:var(--no-bg)}
td.col-y.on .mark{color:var(--yes-ink); background:var(--yes-bg); border:1.5px solid var(--yes-line)}
td.col-n.on .mark{color:var(--no-ink); background:var(--no-bg); border:1.5px solid var(--no-line)}
tr.is-y td.col-item{background:#f6fcf6}
tr.is-n td.col-item{background:#fff7f7}
.note-input{
  width:100%; border:1px solid transparent; background:transparent; border-radius:6px;
  font:inherit; font-size:12.5px; padding:6px 6px; color:var(--ink); min-height:34px;
}
.note-input::placeholder{color:#b3bfcc}
.note-input:focus{outline:none; border-color:#8fb8e8; background:#fff; box-shadow:0 0 0 2px rgba(143,184,232,.25)}
td.special{background:#fff8e1; color:#4a4a4a; font-size:12px; line-height:1.6; white-space:pre-line; padding:8px 10px; text-align:left; word-break:keep-all}
.notes{padding:10px 14px 16px; border-top:1px solid var(--line2); background:#fcfdff}
.note-line{font-size:11.5px; color:#6b7a8a; line-height:1.6; margin:2px 0}
.foot{max-width:1180px; margin:12px auto 0; font-size:11.5px; color:#6b7a8a; text-align:center; line-height:1.6; padding:0 12px}
/* ---------- 오버레이 ---------- */
.overlay{position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; padding:14px; background:rgba(15,23,42,.45)}
.overlay.show{display:flex}
.sheet-box{background:#fff; border-radius:16px; width:100%; max-width:520px; max-height:92vh; overflow:auto; padding:18px 18px 14px; box-shadow:0 24px 60px rgba(0,0,0,.3)}
.sheet-box h2{font-size:16px; margin:0 0 8px; color:var(--navy)}
.sheet-box p{margin:0 0 10px; font-size:12.5px; line-height:1.6}
.sheet-box .muted{color:var(--muted)}
.sheet-box .tiny{font-size:11px; color:#7b8794; line-height:1.55}
.lbl{display:block; font-size:12px; font-weight:800; color:#33475b; margin:6px 0 5px}
.sheet-box input.wide{width:100%; font:inherit; font-size:12.5px; padding:9px 10px; border:1px solid #c9d6e4; border-radius:9px; background:#fbfdff}
.row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.row.end{justify-content:flex-end}
.btn{border:1px solid #cfd9e5; background:#f7f9fc; color:#22364b; border-radius:9px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer}
.btn.primary{background:var(--navy); border-color:var(--navy); color:#fff}
.btn.ghost{background:#fff}
.btn:active{transform:translateY(1px)}
.msg{font-size:12px; margin-top:8px; min-height:16px; font-weight:700}
.msg.ok{color:#1b5e20} .msg.err{color:#b71c1c}
.hr{height:1px; background:var(--line2); margin:14px 0}
.opts{display:flex; flex-direction:column; gap:8px; margin-top:6px}
.opt{display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; border:1px solid #d5dee8; background:#f9fbfe;
  border-radius:11px; padding:11px 13px; cursor:pointer}
.opt b{font-size:13.5px; color:var(--navy)}
.opt span{font-size:11.5px; color:var(--muted)}
.opt:active{background:#eef4fb}
/* ---------- 인쇄 ---------- */
@media print{
  @page{size:A4 landscape; margin:9mm 10mm}
  html,body{background:#fff !important}
  .stick,.foot,.no-print,.overlay,.ym{display:none !important}
  .wrap{max-width:none; margin:0; padding:0}
  .panel{display:none; border:none; border-radius:0; box-shadow:none; margin:0}
  .panel.active{display:block}
  body.print-all .panel{display:block; page-break-after:always; break-after:page}
  body.print-all .panel:last-child{page-break-after:auto; break-after:auto}
  .ph{padding:0 0 4px; background:#fff !important}
  .pt{font-size:13pt; text-align:center}
  .ps{font-size:11pt; margin-top:1px}
  .pd{font-size:8pt; margin-top:3px}
  .period{font-size:8pt; padding:1px 6px; border:1px solid #999; background:#fff}
  .meta-row{padding:4px 0; border:none; background:#fff !important; gap:6px 18px}
  .mf label{font-size:9pt}
  .mf input{font-size:9pt; border:none; border-bottom:1px solid #444; border-radius:0; background:#fff !important; padding:1px 2px; min-height:0; width:120px}
  .mf input.inp-date{width:110px}
  .mf input.inp-name{width:100px}
  .prog{font-size:8pt}
  .bar{display:none}
  .table-wrap{overflow:visible}
  table{min-width:0; font-size:8.5pt}
  thead{display:table-header-group}
  thead th{background:#1f4e79 !important; color:#fff !important; font-size:8pt; padding:3px 2px; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  th,td{border:1px solid #7a7a7a !important; padding:2px 3px}
  tr{page-break-inside:avoid; break-inside:avoid}
  td.col-g{font-size:7.5pt; padding:1px}
  td.col-num,td.col-item{font-size:8.5pt}
  td.col-item{line-height:1.35}
  .mark{border:1px solid #999; min-height:0; height:auto; padding:1px 0; font-size:10pt; border-radius:0}
  td.col-y.on{background:var(--yes-bg) !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  td.col-n.on{background:var(--no-bg) !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  td.col-y.on .mark{background:var(--yes-bg) !important; color:var(--yes-ink) !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  td.col-n.on .mark{background:var(--no-bg) !important; color:var(--no-ink) !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  tr.is-y td.col-item{background:#f6fcf6 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  tr.is-n td.col-item{background:#fff7f7 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  .note-input{border:none !important; padding:0 1px; min-height:0; font-size:8.5pt; box-shadow:none !important}
  .mf input::placeholder,.note-input::placeholder{color:transparent !important}
  td.special{font-size:7.5pt; background:#fffbe8 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; padding:3px 4px}
  .notes{padding:4px 0 0; border:none; background:#fff}
  .note-line{font-size:7pt}
}
/* ---------- PDF 캡처 모드 ---------- */
body.pdf-mode{background:#fff; overflow-x:auto}
body.pdf-mode .stick,body.pdf-mode .foot{display:none !important}
body.pdf-mode .wrap{max-width:none; margin:0; padding:0}
body.pdf-mode .panels{width:1240px}
body.pdf-mode .panel{display:none; width:1240px; margin:0; border:none; border-radius:0; box-shadow:none}
body.pdf-mode .panel.pdf-target{display:block}
body.pdf-mode .pt{font-size:19px}
body.pdf-mode td.col-item{font-size:14px}
body.pdf-mode .note-input{border:none}
body.pdf-mode input::placeholder{color:transparent}
.g-tag{display:none}
@media (max-width:640px){
  .bsub{display:none}
  .topbar{flex-wrap:wrap; row-gap:5px}
  .brand{flex:1 1 100%}
  .tools{margin-left:auto}
  .bt{font-size:13.5px; white-space:normal; line-height:1.25}
  .logo{font-size:18px}
  .badge{font-size:11px; padding:4px 8px}
  .ibtn{min-width:32px; min-height:32px; padding:5px 6px; font-size:14px}
  .pt{font-size:15px}
  .ps{font-size:13px}
  .col-g{width:58px} .col-num{width:44px} .col-y{width:46px} .col-n{width:56px} .col-note{width:118px}
  table{min-width:620px}
  td.col-item{font-size:12.5px}
  .mf input.inp-date{width:132px}
  .mf input.inp-name{width:110px}
  .prog{margin-left:0}
}
@media (max-width:560px){
  .col-g{display:none}
  table{width:100%; min-width:0}
  .col-num{width:34px} .col-y{width:44px} .col-n{width:50px} .col-note{width:84px}
  td.col-num{font-size:12px}
  td.col-item{font-size:12px; line-height:1.5}
  .mark{min-height:34px; font-size:18px; border-radius:6px}
  .note-input{font-size:12px; padding:6px 4px; min-height:32px}
  .g-tag{display:inline-block; font-size:10px; font-weight:800; color:#1f3864; background:#eaf1f9;
    border:1px solid #d3e1f1; border-radius:5px; padding:1px 5px; margin:0 4px 2px 0; vertical-align:middle}
  .pt{font-size:14.5px}
  .pd{font-size:11px}
  .meta-row{gap:6px 10px; padding:8px 10px}
  .mf input.inp-date{width:124px}
  .mf input.inp-name{width:96px}
}

</style>
</head>
<body>
<div class="stick">
  <div class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">🛡️</span>
      <span class="bwrap">
        <span class="bt">만천초등학교 안전보건 자체점검표</span>
        <span class="ym no-print">
          <select id="selYear" aria-label="연도"></select>
          <select id="selMonth" aria-label="월"></select>
        </span>
      </span>
    </div>
    <div class="tools">
      <button id="badge" class="badge" type="button" title="동기화 상태">🟡 오프라인(로컬 저장)</button>
      <button class="ibtn" id="btnSync" type="button" title="동기화 설정" aria-label="동기화 설정">⚙️</button>
      <button class="ibtn" id="btnPrint" type="button" title="인쇄" aria-label="인쇄">🖨️</button>
      <button class="ibtn" id="btnPdf" type="button" title="PDF 저장" aria-label="PDF 저장">📄</button>
    </div>
  </div>
  <div class="tabs" id="tabs" role="tablist" aria-label="직종 탭"></div>
</div>

<main class="wrap">
  <div class="panels" id="panels"></div>
  <div class="foot" id="foot"></div>
</main>

<div class="overlay" id="overlay"><div class="sheet-box" id="sheetBox" role="dialog" aria-modal="true"></div></div>

<script>

    if(!o || typeof o !== 'object') return;

    if(o.rows && typeof o.rows === 'object'){
      Object.keys(o.rows).forEach(function(k){ if(TAB_BY_KEY[k] && o.rows[k]) S.rows[k] = o.rows[k]; });
    }
    if(o.meta && typeof o.meta === 'object'){
      Object.keys(o.meta).forEach(function(k){
        if(!TAB_BY_KEY[k] || !o.meta[k]) return;
        S.meta[k] = { date:o.meta[k].date||'', inspector:o.meta[k].inspector||'' };
      });
    }
    if(o.pending && typeof o.pending === 'object'){
      Object.keys(o.pending).forEach(function(k){
        var p = o.pending[k];
        if(p && typeof p === 'object' && p.v !== undefined) S.pending[k] = { v:p.v, ts:p.ts||Date.now() };
      });
    }
  }catch(e){}
})();

var saveTimer = null;
function saveLocal(){ try{ localStorage.setItem(LS_STATE, JSON.stringify(S)); }catch(e){} }
function saveSoon(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ saveTimer = null; saveLocal(); }, 250);
}

function defRow(key, i){ return TAB_BY_KEY[key].rows[i]; }
function getCell(key, i, f){
  var rec = S.rows[key] && S.rows[key][i];
  if(rec && rec[f] !== undefined && rec[f] !== null) return rec[f];
  var d = defRow(key, i);
  if(!d) return f === 'note' ? '' : 0;
  if(f === 'note') return d.note || '';
  if(f === 'y') return d.y ? 1 : 0;
  return d.n ? 1 : 0;
}
function setCell(key, i, f, v){
  if(!S.rows[key]) S.rows[key] = {};
  var rec = S.rows[key][i];
  if(!rec) rec = S.rows[key][i] = {};
  rec[f] = v;
}
function keyOf(key, i, f){ return key + '|' + i + '|' + f; }
function metaKey(key, f){ return key + '|meta|' + f; }
function queue(key, i, f, v){
  S.pending[keyOf(key, i, f)] = { v:v, ts:Date.now() };
  saveSoon();
  sync.scheduleFlush();
}
function queueMeta(key, f, v){
  S.pending[metaKey(key, f)] = { v:v, ts:Date.now() };
  saveSoon();
  sync.scheduleFlush();
}
function isMark(v){
  var s = String(v == null ? '' : v).replace(/\s+/g,'');
  if(!s) return 0;
  return /^[∨√✓✔VvOo○●◯]/.test(s) ? 1 : 0;
}

    mf1.appendChild(lab1); mf1.appendChild(dEl);

    var lab2 = document.createElement('label'); lab2.textContent = '점검자';

    nEl.dataset.k = metaKey(t.key, 'inspector');
    mf2.appendChild(lab2); mf2.appendChild(nEl);

    setMetaInput(dEl, S.meta[t.key].date);

    notes.className = 'notes';

      line.className = 'note-line';
      line.textContent = n;
      notes.appendChild(line);
    });
    p.appendChild(notes);

    table.addEventListener('click', function(e){
      var btn = e.target && e.target.closest ? e.target.closest('.mark') : null;
      if(!btn) return;
      var tr = btn.closest('tr');
      if(!tr || tr.dataset.i === undefined) return;
      var i = +tr.dataset.i;
      var isYes = btn.parentNode.classList.contains('col-y');
      toggleMark(t.key, i, isYes ? 'y' : 'n');
    });

    table.addEventListener('input', function(e){
      var el = e.target;
      if(!el || !el.classList || !el.classList.contains('note-input')) return;
      var i = +el.dataset.i;
      setCell(t.key, i, 'note', el.value);
      queue(t.key, i, 'note', el.value);
    });

    panelsEl.appendChild(p);
    refs[t.key] = {
      panel:p, rows:rowRefs, date:dEl, name:nEl, ptEl:pt,
      prog:ptxt, bar:barI, title:t.title, short:t.short || t.name
    };
  });

  TABS.forEach(function(t){
    paintAll(t.key);
    updateProgress(t.key);
  });

function paintRow(key, i){
  var r = refs[key] && refs[key].rows[i];
  if(!r) return;
  var y = getCell(key, i, 'y') ? 1 : 0;
  var n = getCell(key, i, 'n') ? 1 : 0;
  r.ty.classList.toggle('on', !!y);
  r.tn.classList.toggle('on', !!n);
  r.tr.classList.toggle('is-y', !!y);
  r.tr.classList.toggle('is-n', !!n);
  var note = getCell(key, i, 'note');
  if(document.activeElement !== r.note && r.note.value !== note) r.note.value = note;
}
function paintAll(key){
  var rows = TAB_BY_KEY[key].rows;
  for(var i=0;i<rows.length;i++) if(!rows[i].sp) paintRow(key, i);
}

function updateProgress(key){
  var t = TAB_BY_KEY[key];
  var r = refs[key];
  if(!r) return;
  var done = 0, total = 0;
  t.rows.forEach(function(row, i){
    if(row.sp) return;
    total++;
    if(getCell(key, i, 'y') || getCell(key, i, 'n')) done++;
  });
  r.prog.textContent = done + ' / ' + total + ' 완료';
  r.bar.style.width = total ? (done / total * 100).toFixed(1) + '%' : '0%';
}

function toggleMark(key, i, f){
  var cur = getCell(key, i, f) ? 1 : 0;
  var other = f === 'y' ? 'n' : 'y';
  if(cur){
    setCell(key, i, f, 0);
    queue(key, i, f, 0);
  }else{
    setCell(key, i, f, 1);
    queue(key, i, f, 1);
    if(getCell(key, i, other)){
      setCell(key, i, other, 0);
      queue(key, i, other, 0);
    }
  }
  paintRow(key, i);
  updateProgress(key);
}

function setDateAll(v){
  v = v || '';
  TABS.forEach(function(t){
    S.meta[t.key].date = v;
    var r = refs[t.key];
    if(r && r.date && document.activeElement !== r.date) setMetaInput(r.date, v);
    queueMeta(t.key, 'date', v);
  });
}

function setMetaInput(el, val){
  val = (val == null) ? '' : String(val);
  if(/^\d{4}-\d{2}-\d{2}$/.test(val)){ el.type = 'date'; el.value = val; }
  else if(!val){ el.type = 'date'; el.value = ''; }
  else { el.type = 'text'; el.value = val; }
}

function selectTab(key, doPoll){
  if(!TAB_BY_KEY[key]) key = TABS[0].key;
  S.tab = key;
  saveSoon();
  $$('.tab').forEach(function(b){ b.classList.toggle('active', b.dataset.key === key); });
  $$('.panel').forEach(function(p){ p.classList.toggle('active', p.dataset.key === key); });
  var r = refs[key];
  setMetaInput(r.date, S.meta[key].date);
  r.name.value = S.meta[key].inspector || '';
  updateProgress(key);
  if(doPoll && sync.url) sync.pollNow();
  try{ window.scrollTo({ top:0, behavior:'auto' }); }catch(e){ window.scrollTo(0,0); }
}

/* ================= 동기화 ================= */
var sync = {
  url:'', online:false, lastOk:0, polling:false, flushing:false,
  timer:null, ftimer:null, fail:0,
  init:function(){
    var u = '';
    try{ u = localStorage.getItem(LS_URL) || ''; }catch(e){}
    try{
      var qp = new URLSearchParams(location.search).get('sync');
      if(qp){ u = qp; localStorage.setItem(LS_URL, u); }
    }catch(e){}
    if(!u) u = DEFAULT_SYNC_URL || '';
    this.url = (u || '').trim();
    this.render();
    if(this.url){
      this.pollNow();
      this.scheduleFlush(600);
    }
  },
  isOn:function(){ return !!this.url; },
  render:function(){
    var b = $('#badge');
    var on = this.isOn() && this.online;
    b.classList.toggle('ok', on);
    b.textContent = on ? '🟢 실시간 동기화' : '🟡 오프라인(로컬 저장)';
    b.title = on ? ('마지막 확인 ' + timeStr(this.lastOk))
      : (this.isOn() ? '서버에 연결하지 못해 이 기기에 저장 중입니다 (다시 시도합니다)'
                     : '동기화가 설정되지 않았습니다 — ⚙️ 설정');
    var f = $('#foot');
    if(f){
      f.textContent = on
        ? '🟢 실시간 동기화 중 · 마지막 확인 ' + timeStr(this.lastOk) + ' · 바꾼 칸만 구글 시트에 저장됩니다.'
        : '🟡 오프라인(이 기기에 저장) · 입력한 내용은 이 기기에 저장되고, 연결되면 자동으로 구글 시트에 반영됩니다.';
    }
  },
  pollNow:function(){
    if(!this.url || this.polling) return;
    var t = TAB_BY_KEY[S.tab];
    if(!t) return;
    var self = this;
    this.polling = true;
    var u = this.url + (this.url.indexOf('?') >= 0 ? '&' : '?') +
            'action=state&tab=' + encodeURIComponent(t.name) + '&_=' + Date.now();
    fetch(u, { method:'GET', cache:'no-store' })
      .then(function(r){ return r.text(); })
      .then(function(txt){
        var j = JSON.parse(txt);
        if(!j || !j.ok) throw new Error((j && j.error) || 'ERR');
        self.online = true; self.lastOk = Date.now(); self.fail = 0;
        if(j.tab) self.mergeTab(j.tab);
      })
      .catch(function(){ self.online = false; })
      .then(function(){
        self.polling = false;
        self.render();
        self.schedule();
      });
  },
  schedule:function(){
    var self = this;
    clearTimeout(this.timer);
    if(!this.url || document.hidden) return;
    this.timer = setTimeout(function(){ self.pollNow(); }, this.online ? POLL_MS : 12000);
  },
  mergeTab:function(obj){
    var key = TAB_NAME_KEY[obj.name];
    if(!key) return;
    var tab = TAB_BY_KEY[key];
    var r = refs[key];
    if(!r) return;
    var active = document.activeElement;

    ['date','inspector'].forEach(function(f){
      var pkey = metaKey(key, f);
      if(S.pending[pkey] !== undefined) return;
      var el = f === 'date' ? r.date : r.name;
      if(active && active.dataset && active.dataset.k === pkey) return;
      var v = (obj[f] == null) ? '' : String(obj[f]);
      if((S.meta[key][f] || '') !== v){
        S.meta[key][f] = v;
        if(document.activeElement !== el) setMetaInput(el, v);
      }
    });

    var rows = obj.rows || [];
    for(var n=0; n<rows.length; n++){
      var sr = rows[n];
      var i = (+sr.r) - 6;
      if(!(i >= 0 && i < tab.rows.length)) continue;
      var el = r.rows[i];
      if(!el) continue;
      this.applyMark(key, i, 'y', isMark(sr.y));
      this.applyMark(key, i, 'n', isMark(sr.n));
      if(document.activeElement === el.note) continue;
      if(S.pending[keyOf(key, i, 'note')] !== undefined) continue;
      var v = (sr.note == null) ? '' : String(sr.note);
      if(getCell(key, i, 'note') !== v){
        setCell(key, i, 'note', v);
        paintRow(key, i);
      }
    }
    saveSoon();
    updateProgress(key);
  },
  applyMark:function(key, i, f, val){
    if(S.pending[keyOf(key, i, f)] !== undefined) return;
    var cur = getCell(key, i, f) ? 1 : 0;
    if(cur !== val){
      setCell(key, i, f, val);
      paintRow(key, i);
    }
  },
  scheduleFlush:function(ms){
    if(!this.url) return;
    var self = this;
    clearTimeout(this.ftimer);
    this.ftimer = setTimeout(function(){ self.flushNow(); }, ms == null ? 700 : ms);
  },
  flushNow:function(){
    if(!this.url) return;
    var keys = Object.keys(S.pending);
    if(!keys.length) return;
    if(this.flushing){ this.scheduleFlush(600); return; }

    var self = this;
    this.flushing = true;
    var take = keys.slice(0, 60);
    var sent = [];
    var updates = [];

    take.forEach(function(k){
      var p = S.pending[k];
      if(!p) return;
      var parts = k.split('|');
      var key = parts[0], idx = parts[1], f = parts[2];
      var tab = TAB_BY_KEY[key];
      if(!tab) return;
      var val;
      var field;
      if(f === 'y'){ field = 'yes'; val = p.v ? '∨' : ''; }
      else if(f === 'n'){ field = 'no'; val = p.v ? '∨' : ''; }
      else if(f === 'note'){ field = 'note'; val = String(p.v == null ? '' : p.v); }
      else if(f === 'date'){ field = 'date'; val = String(p.v == null ? '' : p.v); }
      else if(f === 'inspector'){ field = 'inspector'; val = String(p.v == null ? '' : p.v); }
      else return;
      var u = { tab:tab.name, field:field, value:val };
      if(idx !== 'meta') u.r = (+idx) + 6;
      updates.push(u);
      sent.push({ k:k, ts:p.ts });
    });

    if(!updates.length){ this.flushing = false; return; }

    fetch(this.url, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'batchUpdate', clientId:CLIENT_ID, updates:updates })
    })
      .then(function(r){ return r.text(); })
      .then(function(txt){
        var j = JSON.parse(txt);
        if(!j || !j.ok) throw new Error((j && j.error) || 'ERR');
        self.online = true; self.lastOk = Date.now(); self.fail = 0;
        sent.forEach(function(s){
          var p = S.pending[s.k];
          if(p && p.ts === s.ts) delete S.pending[s.k];
        });
        saveLocal();
        if(Object.keys(S.pending).length) self.scheduleFlush(300);
      })
      .catch(function(){
        self.online = false;
        self.fail++;
      })
      .then(function(){
        self.flushing = false;
        self.render();
        if(!self.online && Object.keys(S.pending).length){
          self.scheduleFlush(Math.min(15000, 2000 * self.fail));
        }
      });
  },
  test:function(url){
    var u = (url||'').trim();
    if(!u) return Promise.reject(new Error('URL이 비어 있습니다.'));
    return fetch(u + (u.indexOf('?') >= 0 ? '&' : '?') + 'action=ping&_=' + Date.now(), { method:'GET', cache:'no-store' })
      .then(function(r){ return r.text(); })
      .then(function(txt){
        var j = JSON.parse(txt);
        if(!j || !j.ok) throw new Error((j && j.message) || (j && j.error) || '응답을 확인할 수 없습니다.');
        return j;
      });
  },
  setUrl:function(u){
    this.url = (u||'').trim();
    try{ localStorage.setItem(LS_URL, this.url); }catch(e){}
    this.online = false;
    this.render();
    if(this.url){
      this.pollNow();
      this.scheduleFlush(300);
    }
  }
};

/* ================= 오버레이 ================= */
var escKeyHandler = null;

function showOverlay(html, binder){
  var ov = $('#overlay');
  var box = $('#sheetBox');
  box.innerHTML = html;
  ov.classList.add('show');
  if(binder) binder(box);
  ov.onclick = function(e){ if(e.target === ov) closeOverlay(); };
  escKeyHandler = function(e){ if(e.key === 'Escape') closeOverlay(); };
  document.addEventListener('keydown', escKeyHandler);
}
function closeOverlay(){
  var ov = $('#overlay');
  ov.classList.remove('show');
  ov.onclick = null;
  if(escKeyHandler){ document.removeEventListener('keydown', escKeyHandler); escKeyHandler = null; }
}

function copyText(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(txt);
  }
  return new Promise(function(res, rej){
    try{
      var ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      res();
    }catch(e){ rej(e); }
  });
}

      }).catch(function(err){

function hidePlaceholders(roots){
  var saved = [];
  roots.forEach(function(root){
    Array.prototype.forEach.call(root.querySelectorAll('input[placeholder]'), function(el){
      if(!el.value){ saved.push([el, el.getAttribute('placeholder')]); el.removeAttribute('placeholder'); }
    });
  });
  return saved;
}
function restorePlaceholders(saved){
  (saved || []).forEach(function(x){ x[0].setAttribute('placeholder', x[1]); });
}

function doPrint(all){
  closeOverlay();
  var saved = hidePlaceholders(all ? TABS.map(function(t){ return refs[t.key].panel; }) : [refs[S.tab].panel]);
  document.body.classList.toggle('print-all', !!all);
  setTimeout(function(){
    try{ window.print(); }catch(e){}
    setTimeout(function(){
      document.body.classList.remove('print-all');
      restorePlaceholders(saved);
    }, 500);
  }, 80);
}

var libsPromise = null;
function ensureLibs(){
  if(window.html2canvas && window.jspdf) return Promise.resolve();
  if(libsPromise) return libsPromise;
  libsPromise = new Promise(function(res, rej){
    var a = document.createElement('script');
    a.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    a.onload = function(){
      var b = document.createElement('script');
      b.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
      b.onload = function(){ res(); };
      b.onerror = function(){ libsPromise = null; rej(new Error('jspdf')); };
      document.head.appendChild(b);
    };
    a.onerror = function(){ libsPromise = null; rej(new Error('html2canvas')); };
    document.head.appendChild(a);
  });
  return libsPromise;
}

function cropBand(canvas, y0, y1){
  var h = Math.max(1, Math.round(y1 - y0));
  var c = document.createElement('canvas');
  c.width = canvas.width;
  c.height = h;
  var ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(canvas, 0, -Math.round(y0));
  return c;
}
function stackBands(top, bottom){
  var c = document.createElement('canvas');
  c.width = Math.max(top.width, bottom.width);
  c.height = top.height + bottom.height;
  var ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(top, 0, 0);
  ctx.drawImage(bottom, 0, top.height);
  return c;
}

async function renderPanelToPdf(pdf, panel, state){
  var PW = 297, PH = 210, M = 8;
  var iw = PW - M * 2;

  var canvas = await window.html2canvas(panel, {
    scale: 2,
    backgroundColor: '#ffffff',
    logging: false,
    useCORS: false,
    windowWidth: 1240
  });

  var pRect = panel.getBoundingClientRect();
  var k = canvas.width / Math.max(1, panel.offsetWidth);
  var pxPerMm = canvas.width / iw;
  var pagePx = (PH - M * 2) * pxPerMm;

  // 표 머리글 띠 (이어지는 페이지에 반복)
  var headCanvas = null;
  var thead = panel.querySelector('thead');
  if(thead){
    var hr = thead.getBoundingClientRect();
    var y0 = Math.round((hr.top - pRect.top) * k);
    var y1 = Math.round((hr.bottom - pRect.top) * k);
    if(y1 > y0 + 2) headCanvas = cropBand(canvas, y0, y1);
  }
  var headPx = headCanvas ? headCanvas.height : 0;

  // 행 경계에서만 페이지를 끊는다
  var bounds = [];
  Array.prototype.forEach.call(panel.querySelectorAll('tbody tr'), function(tr){
    var r = tr.getBoundingClientRect();
    bounds.push({ top:(r.top - pRect.top) * k, bottom:(r.bottom - pRect.top) * k });
  });

  var total = canvas.height;
  var y = 0;
  var pageNo = 0;
  while(y < total - 1){
    var cont = pageNo > 0;
    var avail = pagePx - (cont ? headPx : 0);
    var limit = y + avail;
    var cut = limit;
    for(var i=0;i<bounds.length;i++){
      if(bounds[i].bottom > y + 1 && bounds[i].bottom <= limit) cut = bounds[i].bottom;
      else if(bounds[i].top >= limit) break;
    }
    if(cut <= y + 1) cut = limit;
    cut = Math.min(cut, total);

    var slice = cropBand(canvas, y, cut);
    var pageCanvas = (cont && headCanvas) ? stackBands(headCanvas, slice) : slice;

    if(state.started) pdf.addPage('a4', 'landscape');
    else state.started = true;
    pdf.addImage(pageCanvas.toDataURL('image/jpeg', 0.92), 'JPEG', M, M, iw, pageCanvas.height / pxPerMm, undefined, 'FAST');

    y = cut;
    pageNo++;
  }
}

async function doPdf(all){
  closeOverlay();
  var btn = $('#btnPdf');
  if(btn) btn.disabled = true;
  var dateEls = [];
  var phSaved = [];
  try{
    await ensureLibs();
    var targets = all ? TABS.map(function(t){ return refs[t.key].panel; }) : [refs[S.tab].panel];
    document.body.classList.add('pdf-mode');
    targets.forEach(function(p){ p.classList.add('pdf-target'); });
    phSaved = hidePlaceholders(targets);
    dateEls = targets.map(function(p){ return p.querySelector('.inp-date'); });
    dateEls.forEach(function(el){ if(el && el.type === 'date'){ el.type = 'text'; el.dataset.wasDate = '1'; } });
    await sleep(200);

    var jsPDF = window.jspdf.jsPDF;
    var pdf = new jsPDF({ orientation:'landscape', unit:'mm', format:'a4', compress:true });
    var state = { started:false };

    for(var i=0;i<targets.length;i++){
      await renderPanelToPdf(pdf, targets[i], state);
    }

    var shortName = all ? '전체' : (refs[S.tab].short || TAB_BY_KEY[S.tab].name);
    pdf.save(YM.y + '년' + YM.m + '월_만천초등학교_안전보건_자체점검표_' + shortName + '.pdf');
  }catch(e){
    restorePlaceholders(phSaved);
    dateEls.forEach(function(el){ if(el && el.dataset.wasDate){ el.type = 'date'; delete el.dataset.wasDate; } });
    document.body.classList.remove('pdf-mode');
    TABS.forEach(function(t){ refs[t.key].panel.classList.remove('pdf-target'); });
    if(btn) btn.disabled = false;
    alert('PDF 저장 도구를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 시도하거나, 인쇄 창에서 "PDF로 저장"을 선택해 주세요.');
    doPrint(all);
    return;
  }
  restorePlaceholders(phSaved);
  dateEls.forEach(function(el){ if(el && el.dataset.wasDate){ el.type = 'date'; delete el.dataset.wasDate; } });
  document.body.classList.remove('pdf-mode');
  TABS.forEach(function(t){ refs[t.key].panel.classList.remove('pdf-target'); });
  if(btn) btn.disabled = false;
}

function start(){
  build();
  fillYmSelects();
  applyYm();
  $('#selYear').addEventListener('change', function(){ setYm(+this.value, YM.m); });
  $('#selMonth').addEventListener('change', function(){ setYm(YM.y, +this.value); });
  selectTab(S.tab, false);
  sync.init();
  $('#badge').addEventListener('click', openSettings);
  $('#btnSync').addEventListener('click', openSettings);
  $('#btnPrint').addEventListener('click', openPrintMenu);
  $('#btnPdf').addEventListener('click', openPdfMenu);
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && sync.url) sync.pollNow();
  });
  window.addEventListener('online', function(){ if(sync.url){ sync.pollNow(); sync.scheduleFlush(300); } });
  window.addEventListener('offline', function(){ sync.online = false; sync.render(); });
  window.addEventListener('beforeunload', function(){ saveLocal(); });
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
else start();

})();
